<html lang="zh-CN"><meta charset="utf-8"><title>跨地区费用门户的语义录入与原币回读</title><body><h1>费用暂存</h1><select id="region"><option value="fr">巴黎</option><option value="us">纽约</option><option value="cn">上海</option></select><output id="rules"></output><label>金额<input id="amount" inputmode="decimal" data-decimal-places="2"></label><label>日期<input id="date" data-separator="/"></label><label>税额<input id="tax" inputmode="decimal" data-decimal-places="2"></label><button id="save">暂存</button><output id="result"></output><script>
let current;async function load(){current=await(await fetch('/rules')).json();rules.textContent=JSON.stringify(current);region.value=current.region;}region.onchange=async()=>{await fetch('/control',{method:'POST',body:JSON.stringify({region:region.value})});await load();};
for(const name of ['amount','tax']){const input=document.getElementById(name);input.onblur=()=>{input.dataset.settled='false';setTimeout(()=>{const normalized=input.value.replaceAll(current.group,'').replace(current.decimal,'.');if(input.value!==''&&!/^-?\d+(\.\d{1,2})?$/.test(normalized)){input.dataset.error='格式无效';}else{delete input.dataset.error;input.dataset.value=normalized;}input.dataset.settled='true';},90);};}
date.onblur=()=>{date.dataset.settled='false';setTimeout(()=>{date.dataset.order=current.dateOrder;const parts=date.value.split(/[\/.-]/).map(Number);const order=current.dateOrder;const year=parts[order.indexOf('Y')];const month=parts[order.indexOf('M')];const day=parts[order.indexOf('D')];const parsed=new Date(Date.UTC(year,month-1,day));if(parts.length!==3||parsed.getUTCFullYear()!==year||parsed.getUTCMonth()!==month-1||parsed.getUTCDate()!==day){date.dataset.error='日期无效';delete date.dataset.value;}else{delete date.dataset.error;date.dataset.value=parsed.toISOString().slice(0,10);}date.dataset.settled='true';},90);};save.onclick=async()=>{if([...document.querySelectorAll('input')].some(input=>input.dataset.error||input.dataset.settled==='false')){result.textContent='字段尚未通过校验';return;}const value={amount:amount.dataset.value,tax:tax.dataset.value,date:date.dataset.value,revision:current.revision};const response=await fetch('/save',{method:'POST',body:JSON.stringify(value)});result.textContent=await response.text();};load();</script></body></html>
